name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      ASC_ISSUER_ID: smoke
      ASC_KEY_ID: smoke
      ASC_PRIVATE_KEY_PATH: /nonexistent
      ASC_ENV_FILE: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:legacy
